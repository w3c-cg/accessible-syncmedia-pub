name: Use Case
description: Capture user experience needs for accessible synchronized media
title: "[Use case]: "
labels:
  - use case
body:
  - type: markdown
    attributes:
      value: |
        Use this form to describe a user experience need, risk, or failure mode.
        Prefer concrete scenarios over abstract requirements.

  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Describe the use case.
      placeholder: "As a reader using a screen reader offline during an evacuation, I need..."
    validations:
      required: true

  - type: dropdown
    id: user-group
    attributes:
      label: Primary user group
      description: Choose the group most affected by this issue.
      options:
        - Readers
        - Producers
    validations:
      required: true

  - type: input
    id: user-group-other
    attributes:
      label: User details
      description: Add any specific role, relationship, or context for the user.
      placeholder: "Example: teacher, caregiver, student, librarian"

  - type: dropdown
    id: content-types
    attributes:
      label: Content type
      description: Choose one content type for this specific scenario.
      multiple: false
      options:
        - Trade book
        - Textbook or manual
        - Interactive e-learning
        - Emergency services
        - Other
    validations:
      required: true

  - type: input
    id: content-type-other
    attributes:
      label: Other content type
      description: Fill this in if "Other" content applies.

  - type: checkboxes
    id: user-access-need
    attributes:
      label: User access need
      description: Select all known or likely user needs. Add details below.
      options:
        - label: Trauma-related needs
        - label: Visual impairment
        - label: Hearing impairment
        - label: Language-related
        - label: Neurodivergence
        - label: Dyslexia
        - label: Easy-to-read text required
        - label: Other disability, access need, or situational constraint

  - type: input
    id: access-need-other
    attributes:
      label: More information about the user's access needs.
      description: 

  - type: textarea
    id: situation-details
    attributes:
      label: Situation details
      description: Include what is known about context, urgency, language, cognition, sensory needs, stress level, or safety constraints.
      placeholder: "Example: The user may be under time pressure, and unable to effectively read text in their second language."
    validations:
      required: true

  - type: checkboxes
    id: location-connectivity
    attributes:
      label: Location and connectivity
      description: Select a few conditions for this specific scenario.
      options:
        - label: Public setting
        - label: Private setting
        - label: Mobile or in transit
        - label: Online
        - label: Offline
        - label: Low bandwidth or unreliable connectivity
        - label: Public kiosk or shared device

  - type: input
    id: location-connectivity-other
    attributes:
      label: Other location or connectivity detail
      description: Fill this in if the user's environment is not covered above.

  - type: checkboxes
    id: modalities
    attributes:
      label: Modalities and interaction
      description: How might the user perceive and operate the content?
      options:
        - label: Listening
        - label: Reading
        - label: Watching video
        - label: Viewing images or diagrams
        - label: Going back and forth between modalities
        - label: Keyboard navigation
        - label: Touch input
        - label: Voice input or speech control
        - label: Switch, joystick, or alternative input

  - type: input
    id: modality-other
    attributes:
      label: Other modality or interaction method
      description: Fill this in if the user's way of perceiving or operating content is not covered above.

  - type: textarea
    id: assistive-tech
    attributes:
      label: Assistive technologies and interface
      description: Name any assistive technology in use.
      placeholder: "Example: Screen reader, zoom text, refreshable braille display, captions, hearing aids"

  - type: textarea
    id: task-success-failure
    attributes:
      label: Task, success, and failure
      description: Describe the task, what success looks like, and what failure looks like if the need is not met.
      placeholder: "Example: The user needs to find the correct evacuation route and confirm what to bring. Success means they can identify the route and understand the instructions in their language. Failure means they miss critical instructions because audio has no transcript or the route map is not screen-reader accessible."
    validations:
      required: true

  - type: textarea
    id: other-comments
    attributes:
      label: Other comments
      description: Any other information.
