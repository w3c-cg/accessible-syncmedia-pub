name: User Requirement
description: Propose a single user requirement derived from one or more existing use cases.
title: "[User requirement] "
labels:
  - requirement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe one user requirement clearly and concisely.
    validations:
      required: false

  - type: input
    id: use-case
    attributes:
      label: Use case(s)
      description: "Enter the related use case issue numbers."
      placeholder: "#1, #2, #6"
    validations:
      required: true
